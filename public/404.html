<!DOCTYPE html>
<!--
  404.html — حل مشكلة "GitHub Pages + React Router (BrowserRouter)"
  ════════════════════════════════════════════════════════════
  المشكلة: GitHub Pages سيرفر ملفات ثابتة بسيط — لا يعرف شيئاً عن مسارات
  React Router الداخلية (مثل /distributions). فتح هذا المسار مباشرة، أو
  عمل تحديث (refresh) للصفحة وأنت بداخله، يجعل GitHub Pages يبحث عن ملف
  حقيقي بهذا الاسم فلا يجده، فيُرجع هذه الصفحة (404.html) تلقائياً.

  الحل (نمط معروف وموثَّق لمشاريع SPA على GitHub Pages): بدل عرض رسالة
  خطأ، هذا الملف يحفظ المسار المطلوب في sessionStorage ثم يُعيد التوجيه
  فوراً لـ index.html (الجذر). هناك سكريبت مقابل (في index.html) يقرأ
  المسار المحفوظ ويُصحّح عنوان المتصفح بصمت قبل تحميل React، فيظهر
  المستخدم في الصفحة الصحيحة مباشرة دون أن يلاحظ أي إعادة توجيه ظاهرة.

  مرجع: هذا هو نفس النمط المستخدم في spa-github-pages
  (https://github.com/rafgraph/spa-github-pages)، مُكيَّف لقيمة
  basename الثابتة لهذا المشروع (/camp-registry-react/).
-->
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>نبض المخيم</title>
  <script>
    // pathSegmentsToKeep = 1 لأن basename المشروع جزء واحد: /camp-registry-react/
    var pathSegmentsToKeep = 1;
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body></body>
</html>
